AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Compute API with universal Protected Asset storage and an authorized
  execution-boundary KMS key.

Parameters:
  OpenAIApiKey:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: Server-side OpenAI API key used by the Compute application.
  SessionSecret:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: Secret used to sign Compute application sessions.
  TestResetEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enables the destructive reset action for an isolated non-production test stack.
  TestResetEnvironmentId:
    Type: String
    Default: disabled
    Description: Exact environment identity that a reset request must present.
  TestResetAllowAnyAuthenticatedUser:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Temporary test switch allowing any caller, including an anonymous portal session, to reset an explicitly enabled isolated test stack.
  TestResetAllowedUserIds:
    Type: String
    Default: ''
    Description: Comma-separated authenticated test user IDs allowed to reset this stack.

Globals:
  Function:
    # API relays may stop waiting earlier, but a leased capability finalizer
    # must have time to finish Shorthand materialization and durable indexing.
    # Provider requests retain their own much smaller runtime bounds.
    Timeout: 80
    Tracing: Active
  Api:
    TracingEnabled: true

Resources:
  ComputeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: app/
      Handler: app.lambdaHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          OPENAI_API_KEY: !Ref OpenAIApiKey
          SESSION_SECRET: !Ref SessionSecret
          PROTECTED_ASSETS_TABLE: !Ref ProtectedAssetsTable
          PROTECTED_ASSET_GRANTS_TABLE: !Ref ProtectedAssetGrantsTable
          PROTECTED_ASSET_AUDIT_TABLE: !Ref ProtectedAssetAuditTable
          PROTECTED_ASSET_KMS_KEY_ID: !GetAtt ProtectedAssetExecutorKey.Arn
          PROTECTED_ASSET_ACCESS_REQUESTS_TABLE: !Ref ProtectedAssetAccessRequestsTable
          NOTIFICATIONS_TABLE: !Ref NotificationsTable
          NOTIFICATION_CONTACTS_TABLE: !Ref NotificationContactsTable
          NOTIFICATION_DELAY_QUEUE_URL: !Ref NotificationDelayQueue
          NOTIFICATION_CONTACT_KMS_KEY_ID: !GetAtt NotificationContactKey.Arn
          PATH_FOUNDATION_TABLE: !Ref PathFoundationTable
          CONTEXT_GRAPH_TABLE: !Ref ContextGraphTable
          CANONICAL_PROJECTION_TABLE: !Ref CanonicalProjectionTable
          CANONICAL_AUDIT_TABLE: !Ref CanonicalAuditTable
          CANONICAL_AUDIENCE_SHARDS: '32'
          CANONICAL_WORD_SHARDS: '256'
          CANONICAL_PROFILE_SHARDS: '64'
          CANONICAL_MAPPING_SHARDS: '32'
          TEST_RESET_ENABLED: !Ref TestResetEnabled
          TEST_RESET_ENVIRONMENT_ID: !Ref TestResetEnvironmentId
          TEST_RESET_ALLOW_ANY_AUTHENTICATED_USER: !Ref TestResetAllowAnyAuthenticatedUser
          TEST_RESET_ALLOWED_USER_IDS: !Ref TestResetAllowedUserIds
          TEST_RESET_CONTROL_TABLE: !Ref TestResetControlTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: UseProtectedAssetsTable
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:DescribeTable
                - dynamodb:Scan
                - dynamodb:BatchWriteItem
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt ProtectedAssetsTable.Arn
                - !Sub ${ProtectedAssetsTable.Arn}/index/*
            - Sid: UseProtectedAssetGrantsTable
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:DescribeTable
                - dynamodb:Scan
                - dynamodb:BatchWriteItem
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt ProtectedAssetGrantsTable.Arn
                - !Sub ${ProtectedAssetGrantsTable.Arn}/index/*
            - Sid: UseProtectedAssetAuditTable
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:DescribeTable
                - dynamodb:Scan
                - dynamodb:BatchWriteItem
              Resource: !GetAtt ProtectedAssetAuditTable.Arn
            - Sid: UseProtectedAssetExecutorKey
              Effect: Allow
              Action:
                - kms:GetPublicKey
                - kms:Decrypt
              Resource: !GetAtt ProtectedAssetExecutorKey.Arn
            - Sid: UseNotificationTables
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:DescribeTable
                - dynamodb:Scan
                - dynamodb:BatchWriteItem
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt NotificationsTable.Arn
                - !GetAtt NotificationContactsTable.Arn
                - !GetAtt ProtectedAssetAccessRequestsTable.Arn
            - Sid: UseNotificationContactKey
              Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
              Resource: !GetAtt NotificationContactKey.Arn
            - Sid: QueueNotificationReminders
              Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt NotificationDelayQueue.Arn
            - Sid: SendTransactionalNotificationEmail
              Effect: Allow
              Action:
                - ses:SendEmail
              Resource: '*'
            - Sid: UsePathFoundationTable
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DescribeTable
                - dynamodb:Scan
              Resource: !GetAtt PathFoundationTable.Arn
            - Sid: UseContextGraphTable
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:BatchWriteItem
                - dynamodb:DescribeTable
                - dynamodb:Scan
              Resource:
                - !GetAtt ContextGraphTable.Arn
                - !Sub ${ContextGraphTable.Arn}/index/*
            - Sid: UseCanonicalProjectionTable
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:BatchWriteItem
                - dynamodb:DescribeTable
                - dynamodb:Scan
              Resource: !GetAtt CanonicalProjectionTable.Arn
            - Sid: UseCanonicalAuditTable
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:DescribeTable
                - dynamodb:Scan
                - dynamodb:BatchWriteItem
                - dynamodb:TransactWriteItems
              Resource: !GetAtt CanonicalAuditTable.Arn
            - Sid: UseCanonicalEntitySubstrate
              Effect: Allow
              Action:
                - dynamodb:DescribeTable
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
                - dynamodb:Scan
                - dynamodb:TransactWriteItems
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/words
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/words/index/*
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/entities
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/entities/index/*
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/subdomains
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/subdomains/index/*
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/groups
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/groups/index/*
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/links
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/links/index/*
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/versions
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/versions/index/*
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/perm_grants
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/perm_grants/index/*
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/users
            - Sid: UseTestResetControlTable
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt TestResetControlTable.Arn
            - Sid: ResetKnownIsolatedTestTables
              Effect: Allow
              Action:
                - dynamodb:DescribeTable
                - dynamodb:Scan
                - dynamodb:BatchWriteItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/users
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/versions
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/paths
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/presence
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/presence_invites
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/cookies
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/entities
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/groups
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/links
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/schedules
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/subdomains
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/tasks
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/words
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/perm_grants
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/passphrases
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/enabled
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/email_bounce_events
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/email_sends
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/deliverability_blocks
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/email_metrics_daily
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/anchor_bands
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/access
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/verified
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/embPaths
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/aiCounter
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ciCounter
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/eCounter
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/enCounter
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/gCounter
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/giCounter
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/siCounter
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/tiCounter
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/vCounter
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/viCounter
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/wCounter
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/pCounter
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ppCounter
                - !GetAtt NotificationsTable.Arn
                - !GetAtt NotificationContactsTable.Arn
                - !GetAtt ProtectedAssetAccessRequestsTable.Arn
            - Sid: UseDerivedRetrievalPostings
              Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:BatchWriteItem
                - dynamodb:Scan
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/anchor_bands
      Events:
        Compute:
          Type: Api
          Properties:
            Path: /{proxy}
            Method: any
        NotificationDelay:
          Type: SQS
          Properties:
            Queue: !GetAtt NotificationDelayQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  PathFoundationTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sig
          AttributeType: S
      KeySchema:
        - AttributeName: sig
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ContextGraphTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: audienceId
          AttributeType: S
        - AttributeName: recordKey
          AttributeType: S
        - AttributeName: lookupKey
          AttributeType: S
        - AttributeName: principalId
          AttributeType: S
      KeySchema:
        - AttributeName: audienceId
          KeyType: HASH
        - AttributeName: recordKey
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: lookupKey-index
          KeySchema:
            - AttributeName: lookupKey
              KeyType: HASH
            - AttributeName: principalId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  CanonicalProjectionTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  CanonicalAuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: auditPartition
          AttributeType: S
        - AttributeName: eventKey
          AttributeType: S
      KeySchema:
        - AttributeName: auditPartition
          KeyType: HASH
        - AttributeName: eventKey
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  TestResetControlTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: environmentId
          AttributeType: S
      KeySchema:
        - AttributeName: environmentId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  NotificationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: principalId
          AttributeType: S
        - AttributeName: notificationId
          AttributeType: S
      KeySchema:
        - AttributeName: principalId
          KeyType: HASH
        - AttributeName: notificationId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  NotificationContactsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: principalId
          AttributeType: S
      KeySchema:
        - AttributeName: principalId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ProtectedAssetAccessRequestsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  NotificationContactKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Symmetric key for verified notification delivery contacts; plaintext is used only inside the email boundary.
      Enabled: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountIAMPolicies
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'

  NotificationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  NotificationDelayQueue:
    Type: AWS::SQS::Queue
    Properties:
      DelaySeconds: 60
      VisibilityTimeout: 90
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationDeadLetterQueue.Arn
        maxReceiveCount: 5

  ProtectedAssetsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: assetId
          AttributeType: S
        - AttributeName: ownerId
          AttributeType: S
        - AttributeName: updatedAt
          AttributeType: S
      KeySchema:
        - AttributeName: assetId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ownerId-updatedAt-index
          KeySchema:
            - AttributeName: ownerId
              KeyType: HASH
            - AttributeName: updatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ProtectedAssetAuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: assetId
          AttributeType: S
        - AttributeName: eventKey
          AttributeType: S
      KeySchema:
        - AttributeName: assetId
          KeyType: HASH
        - AttributeName: eventKey
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ProtectedAssetGrantsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: principalId
          AttributeType: S
        - AttributeName: assetId
          AttributeType: S
      KeySchema:
        - AttributeName: principalId
          KeyType: HASH
        - AttributeName: assetId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: assetId-principalId-index
          KeySchema:
            - AttributeName: assetId
              KeyType: HASH
            - AttributeName: principalId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ProtectedAssetExecutorKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: >
        Asymmetric execution-boundary key for wrapping Protected Asset content
        keys. Its private key remains inside AWS KMS.
      Enabled: true
      KeySpec: RSA_3072
      KeyUsage: ENCRYPT_DECRYPT
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountIAMPolicies
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'

  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name:
        Fn::Sub: ApplicationInsights-SAM-${AWS::StackName}
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0

  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      ResourceGroupName:
        Ref: ApplicationResourceGroup
      AutoConfigurationEnabled: 'true'

Outputs:
  ComputeApi:
    Description: API Gateway endpoint URL for Prod stage for Compute function
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  ComputeFunction:
    Description: Compute Lambda Function ARN
    Value: !GetAtt ComputeFunction.Arn
  ComputeFunctionIamRole:
    Description: Implicit IAM Role created for Compute function
    Value: !GetAtt ComputeFunctionRole.Arn
  ProtectedAssetsTableName:
    Description: Protected Asset encrypted-envelope table
    Value: !Ref ProtectedAssetsTable
  ProtectedAssetAuditTableName:
    Description: Protected Asset append-only audit table
    Value: !Ref ProtectedAssetAuditTable
  ProtectedAssetGrantsTableName:
    Description: DynamoDB table for principal-first Protected Asset use grants
    Value: !Ref ProtectedAssetGrantsTable
  ProtectedAssetExecutorKeyArn:
    Description: KMS key ARN used only at the authorized execution boundary
    Value: !GetAtt ProtectedAssetExecutorKey.Arn
  CanonicalProjectionTableName:
    Description: Rebuildable sharded indexes over canonical entity records
    Value: !Ref CanonicalProjectionTable
  CanonicalAuditTableName:
    Description: Append-only sharded authorization and lifecycle evidence
    Value: !Ref CanonicalAuditTable
  TestResetControlTableName:
    Description: Test-only migration marker ordering the legacy purge before canonical resets
    Value: !Ref TestResetControlTable
  NotificationsTableName:
    Description: Authenticated durable browser notification inbox and per-user email latch
    Value: !Ref NotificationsTable
  NotificationContactsTableName:
    Description: KMS-encrypted verified notification delivery contacts
    Value: !Ref NotificationContactsTable
  ProtectedAssetAccessRequestsTableName:
    Description: Opaque pending/decided protected-access request lifecycle records
    Value: !Ref ProtectedAssetAccessRequestsTable
